# Run the full stack: docker compose up --build
# App: http://localhost:8888

services:
  db:
    image: mysql:8.0
    container_name: todo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - todo

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: todo-api
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8888
      APP_DEBUG: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: todo
      DB_USERNAME: todo
      DB_PASSWORD: todo
      CORS_ALLOWED_ORIGINS: http://localhost:8888
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: todo-web
    restart: unless-stopped
    ports:
      - "8888:80"
    depends_on:
      - api
    networks:
      - todo

volumes:
  db_data:

networks:
  todo:
    driver: bridge
