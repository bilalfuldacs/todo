name: Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPO: todo

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="production"
          else
            TARGET="staging"
          fi

          if [ "$TARGET" = "production" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build & push (${{ needs.resolve-environment.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-environment
    environment: ${{ needs.resolve-environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set image registry
        id: images
        run: |
          REGISTRY="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.registry }}/todo-api:${{ needs.resolve-environment.outputs.image_tag }}
            ${{ steps.images.outputs.registry }}/todo-api:${{ needs.resolve-environment.outputs.environment }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: VITE_API_URL=/api/v1
          tags: |
            ${{ steps.images.outputs.registry }}/todo-web:${{ needs.resolve-environment.outputs.image_tag }}
            ${{ steps.images.outputs.registry }}/todo-web:${{ needs.resolve-environment.outputs.environment }}

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: [resolve-environment, build-and-push]
    if: needs.resolve-environment.outputs.environment == 'staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Sync deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          source: "docker-compose.staging.yml,docker-compose.prod.yml,scripts/deploy-remote.sh"
          target: "/opt/todo"

      - name: Run deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/todo
            chmod +x scripts/deploy-remote.sh
            gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet 2>/dev/null || true
            ./scripts/deploy-remote.sh staging "${{ needs.resolve-environment.outputs.image_tag }}"

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [resolve-environment, build-and-push]
    if: needs.resolve-environment.outputs.environment == 'production'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          source: "docker-compose.staging.yml,docker-compose.prod.yml,scripts/deploy-remote.sh"
          target: "/opt/todo"

      - name: Run deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/todo
            chmod +x scripts/deploy-remote.sh
            gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet 2>/dev/null || true
            ./scripts/deploy-remote.sh production "${{ needs.resolve-environment.outputs.image_tag }}"
