# Production — uses GCP Cloud SQL (production instance). DB credentials via .env.production on the server.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  api:
    image: ${REGISTRY}/todo-api:${IMAGE_TAG:-latest}
    container_name: todo-api-prod
    restart: always
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - todo-net
    # depends_on:
    #   - cloud-sql-proxy

  web:
    image: ${REGISTRY}/todo-web:${IMAGE_TAG:-latest}
    container_name: todo-web-prod
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - todo-net

  # cloud-sql-proxy:
  #   image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
  #   command:
  #     - "--structured-logs"
  #     - "--port=3306"
  #     - "${GCP_PROJECT}:${GCP_REGION}:${CLOUD_SQL_INSTANCE_PROD}"
  #   restart: always
  #   networks:
  #     - todo-net

networks:
  todo-net:
    driver: bridge
